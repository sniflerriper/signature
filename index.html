<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pemeriksaan PDF: MediaBox & Font</title>
<style>
    * { box-sizing: border-box }
    html, body { height: 100%; margin: 0; overflow: hidden }
    body { font-family: Segoe UI, Arial, sans-serif; color: #222; background: #f6f7f9 }

    /* Fullscreen: dua sisi menutupi seluruh layar */
    .split { position: fixed; inset: 0; display: flex }

    .panel {
        flex: 1 1 50%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 3vmin;
        gap: 2vmin;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        transition: flex-grow .25s ease, background .25s ease, transform .2s ease;
        position: relative;
    }
    .left  { background: #fde8e8 }
    .right { background: #fff6dc }
    .left:hover,  .left:focus-visible  { background: #fadada; flex-grow: 1.15 }
    .right:hover, .right:focus-visible { background: #fdeebd; flex-grow: 1.15 }
    .panel:focus-visible { outline: 3px solid #222; outline-offset: -6px }

    /* Indikator hover: sedikit scale + bayangan + teks "klik" */
    .panel::after {
        content: "Klik untuk membuka →";
        position: absolute;
        bottom: 2.5vmin;
        left: 50%;
        transform: translateX(-50%) translateY(8px);
        font-size: 13px;
        font-weight: 600;
        color: #444;
        background: #fff;
        padding: 6px 14px;
        border-radius: 20px;
        box-shadow: 0 2px 8px #0003;
        opacity: 0;
        transition: opacity .2s ease, transform .2s ease;
        pointer-events: none;
        white-space: nowrap;
    }
    .left::after { content: "← Klik untuk MediaBox" }
    .right::after { content: "Klik untuk Font →" }
    .panel:hover::after, .panel:focus-visible::after {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    h1 { margin: 0; font-size: clamp(22px, 3.2vmax, 44px); line-height: 1.1 }

    /* Satu preview dokumen, memenuhi sisa layar */
    .docs { flex: 1; min-height: 0; display: flex }
    .doc { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; align-items: center }
    .page {
        flex: 1;
        min-height: 0;
        aspect-ratio: 595.32 / 841.92;
        max-width: 100%;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-shadow: 0 1px 4px #0002;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        transition: box-shadow .2s ease, transform .2s ease;
    }
    .panel:hover .page {
        box-shadow: 0 4px 16px #0003;
        transform: scale(1.01);
    }
    .page img { width: 100%; height: 100%; object-fit: contain; display: block }
    .page .ph { font-size: 14px; color: #888; padding: 12px; text-align: center; word-break: break-all }
    .page .dot {
        position: absolute; top: 10px; right: 10px;
        width: 16px; height: 16px; border-radius: 50%;
        border: 2px solid #fff; box-shadow: 0 0 0 1px #0003
    }
    .dot.ok { background: #0a6b2d } .dot.bad { background: #b00020 } .dot.warn { background: #c98a00 }
    .name { font-size: 13px; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333 }

    @media (max-width: 768px) {
        .split { flex-direction: column }
        .panel { flex-basis: 50%; padding: 2vmin 3vmin }
        .left:hover, .left:focus-visible, .right:hover, .right:focus-visible { flex-grow: 1 }
        h1 { font-size: 20px }
        .name { font-size: 11px }
        .panel::after { font-size: 12px; bottom: 1.5vmin }
    }
    @media (prefers-reduced-motion: reduce) {
        .panel, .page, .panel::after { transition: none }
    }
</style>
</head>

    function build(targetId, info) {
        var box = document.getElementById(targetId);
        var d = document.createElement("div");
        d.className = "doc";
        d.title = info.name;

        var page = document.createElement("div");
        page.className = "page";

        var img = new Image();
        img.alt = info.name;
        img.src = info.src;
        img.onerror = function () {
            img.remove();
            var ph = document.createElement("div");
            ph.className = "ph";
            ph.textContent = info.name;
            page.insertBefore(ph, page.firstChild);
        };
        page.appendChild(img);

        var dot = document.createElement("span");
        dot.className = "dot " + info.status;
        page.appendChild(dot);

        var n = document.createElement("div");
        n.className = "name";
        n.textContent = info.name;

        d.appendChild(page);
        d.appendChild(n);
        box.appendChild(d);
    }

    build("mb", previews.mb);
    build("ft", previews.ft);
</script>
